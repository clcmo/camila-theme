name: Deploy Automatizado com Controle de Versão

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-e-versao:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ 1. Baixando o código do repositório
      uses: actions/checkout@v4

    - name: 🔍 2. Extraindo a versão do style.css
      id: extract_version
      run: |
        VERSION=$(grep -i "Version:" ./wp/style.css | head -n 1 | awk -F: '{print $2}' | xargs)
        if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 🌐 3. Preparando arquivos de Prévia/Mídia (Nativo)
      run: |
        cp ./wp/*.html ./ 2>/dev/null || true

    - name: 🚀 4. Sincronizando arquivos com o Servidor Apache via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp/
        server-dir: /public_html/wordpress/wp-content/themes/${{ github.event.repository.name }}/

    - name: 🌐 5. Preparando a Prévia Estática para o GitHub Pages
      run: |
        run: |
        rm -rf public
        mkdir -p public
        
        # Copia os arquivos HTML direto para a raiz do subdomínio
        cp -r ./wp/*.html public/ 2>/dev/null || true
        
        # Copia a pasta de assets (CSS/JS) direto para a raiz se ela existir
        if [ -d "./wp/assets" ]; then cp -r ./wp/assets public/; fi
        
        # Blinda o Jekyll
        touch public/.nojekyll

        # Alinha com o seu novo subdomínio .com
        echo "theme.camilaloliveira.com" > public/CNAME

    - name: 📦 6. Empacotando Artefato do Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public/

    - name: 🚀 7. Publicando no GitHub Pages Nativo
      uses: actions/deploy-pages@v4

    - name: 🏷️ 8. Criando Tag de Versão e Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Versão v${{ steps.extract_version.outputs.version }}
        body: |
          Deploy de Tema Multimídia realizado com sucesso!
          Código e prévias sincronizados no servidor Apache e GitHub Pages.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
