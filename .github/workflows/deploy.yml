name: Deploy Automatizado com Controle de Versão

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-e-versao:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ 1. Baixando o código do repositório
      uses: actions/checkout@v4

    - name: 🔍 Extraindo a versão do style.css
      id: extract_version
      run: |
        # Ajustado para buscar o style.css dentro da subpasta wp
        VERSION=$(grep -i "Version:" ./wp/style.css | head -n 1 | awk -F: '{print $2}' | xargs)
        if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 🌐 2. Preparando arquivos de Prévia/Mídia (Nativo)
      run: |
        # Copia o arquivo HTML de prévia ou executa a movimentação necessária de forma nativa e segura
        cp ./wp/*.html ./ 2>/dev/null || true

    - name: 🚀 3. Sincronizando arquivos com o Servidor Apache via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp/
        server-dir: /public_html/wordpress/wp-content/themes/${{ github.event.repository.name }}/

    - name: 🌐 4. Preparando a Prévia Estática para o GitHub Pages
      run: |
        # Cria uma pasta temporária para a build estática
        mkdir -p public/${{ github.event.repository.name }}
        
        # Copia apenas os arquivos HTML e assets estruturais de ./wp para a pasta da prévia
        cp -r ./wp/*.html public/${{ github.event.repository.name }}/ 2>/dev/null || true
        
        # Se houver subpastas de css/js/imagens específicos da prévia, copia também:
        if [ -d "./wp/assets" ]; then cp -r ./wp/assets public/${{ github.event.repository.name }}/; fi
        
        # ADICIONE ESTA LINHA PARA BLINDAR A LEITURA DOS ARQUIVOS MULTIMÍDIA:
        touch public/.nojekyll

    - name: 🚀 5. Publicando a Prévia Estática no GitHub Pages (dev.camilaloliveira.me)
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public/
        # Isso vai criar/atualizar a branch gh-pages automaticamente com a estrutura correta


    - name: 🏷️ 6. Criando Tag de Versão e Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Versão v${{ secrets.FTP_SERVER != '' && steps.extract_version.outputs.version }}
        body: |
          Deploy de Tema Multimídia realizado com sucesso!
          Código e prévias sincronizados no servidor Apache.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
