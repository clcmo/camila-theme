name: Deploy Automatizado com Controle de Versão

on:
  push:
    branches:
      - main

# LIBERA A PERMISSÃO DE ESCRITA PARA A ESTEIRA CRIAR AS TAGS E RELEASES
permissions:
  contents: write

jobs:
  deploy-e-versao:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ Baixando o código do repositório
      uses: actions/checkout@v4

    - name: 🔍 Extraindo a versão do style.css
      id: extract_version
      run: |
        VERSION=$(grep -i "Version:" style.css | head -n 1 | awk -F: '{print $2}' | xargs)
        
        if [ -z "$VERSION" ]; then
          VERSION="1.0.0"
        fi
        
        echo "Versão detectada: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 🚀 Sincronizando arquivos com o Servidor Apache via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp/
        server-dir: /public_html/wp/wp-content/themes/${{ github.event.repository.name }}/

    - name: 🏷️ Criando Tag de Versão e Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: Versão v${{ steps.extract_version.outputs.version }}
        body: |
          Deploy automatizado realizado com sucesso!
          Código sincronizado com a instalação Apache do WordPress.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
