name: Deploy Automatizado com Controle de Versão

on:
  push:
    branches:
      - main

jobs:
  deploy-e-versao:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ Baixando o código do repositório
      uses: actions/checkout@v4

    - name: 🔍 Extraindo a versão do style.css
      id: extract_version
      run: |
        VERSION=$(grep -i "Version:" style.css | head -n 1 | awk -F: '{print $2}' | xargs)
        echo "Versão detectada: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 🚀 Sincronizando arquivos com o Servidor Apache via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./wp/
        # O github.event.repository.name pega o nome exato do seu repositório no GitHub dinamicamente
        server-dir: /public_html/wordpress/wp-content/themes/${{ github.event.repository.name }}/

    - name: 🏷️ Criando Tag de Versão no GitHub
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        release_name: Versão v${{ steps.extract_version.outputs.version }}
        body: |
          Deploy automatizado realizado com sucesso!
          Código sincronizado com a instalação Apache do WordPress.
        draft: false
        prerelease: false
