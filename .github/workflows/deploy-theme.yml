name: Render Localized HTML

on:
  push:
    branches:
      - main

# LIBERA A PERMISSÃO DE ESCRITA PARA A ESTEIRA CRIAR AS TAGS E RELEASES
permissions:
  contents: write

jobs:
  deploy-e-versao:
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Renderizando HTML Localizado
        uses: dustuu/Dustuu.Actions.RenderLocalizedHtml@0.0.4
        with:
          # Altere para './' se os arquivos do tema estão direto na raiz do repositório
          input: ./wp
          output: ./
          # A variável correta para o GitHub injetar o caminho absoluto do container:
          workspace: ${{ github.workspace }}

